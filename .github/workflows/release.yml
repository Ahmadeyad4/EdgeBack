name: Release APK
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks
      - name: Build
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          VER=${GITHUB_REF_NAME#v}
          gradle assembleRelease -PverName=$VER -PverCode=${{ github.run_number }}
          mv app/build/outputs/apk/release/app-release.apk EdgeBack-$VER.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: EdgeBack-*.apk
          generate_release_notes: true
